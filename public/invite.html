<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2027 Summerland Masters Green Jacket</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        linear-gradient(rgba(18, 42, 31, 0.48), rgba(18, 42, 31, 0.62)),
        url("IMG_1526.png") center center / cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .welcome {
      width: min(90%, 680px);
      text-align: center;
      padding: 42px 28px;
      background: rgba(20, 45, 34, 0.72);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.28);
      box-shadow: 0 18px 50px rgba(0,0,0,0.28);
    }

    .eyebrow {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #f2e8c8;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      font-size: 44px;
      line-height: 1.05;
    }

    .tagline {
      margin: 20px auto 28px;
      font-size: 21px;
      line-height: 1.4;
      max-width: 520px;
    }

    .button {
      display: inline-block;
      padding: 16px 30px;
      background: #ffffff;
      color: #234f3b;
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      border-radius: 12px;
    }

    .button:active {
      transform: translateY(1px);
    }

    .small {
      margin-top: 20px;
      font-size: 14px;
      color: rgba(255,255,255,0.82);
    }

    @media (max-width: 600px) {
      .welcome {
        padding: 34px 22px;
      }

      h1 {
        font-size: 35px;
      }

      .tagline {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <main class="welcome">
    <div class="eyebrow">You're Invited</div>

    <h1>2027 Summerland Masters Green Jacket</h1>

    <p class="tagline">
      Four days. One team. One Green Jacket.
    </p>

    <a class="button" href="details.html">View Pool Details</a>

    <div class="small">
      Summerland Masters Green Jacket • 2027
    </div>
  </main>

</body>
</html>
