<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2027 Summerland Masters Green Jacket</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background:
        linear-gradient(rgba(9, 25, 18, 0.24), rgba(9, 25, 18, 0.34)),
        url("IMG_1526.png") center center / cover no-repeat;
    }

    .screen {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      align-items: center;
      gap: 34px;
      padding: 50px 6vw;
    }

    .brand {
      max-width: 720px;
      text-shadow: 0 3px 12px rgba(0,0,0,0.55);
    }

    .jacket {
      font-size: 58px;
      margin-bottom: 6px;
    }

    .summerland {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(40px, 5vw, 72px);
      line-height: 0.98;
      letter-spacing: 1px;
      margin: 0;
    }

    .green-jacket {
      margin-top: 12px;
      font-family: Georgia, "Times New Roman", serif;
      color: #23c77a;
      font-size: clamp(28px, 3.4vw, 50px);
      letter-spacing: 10px;
      font-weight: 700;
    }

    .rule {
      width: min(560px, 90%);
      height: 2px;
      background: #d8b44a;
      margin: 18px 0 14px;
    }

    .motto {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(17px, 2vw, 26px);
      letter-spacing: 7px;
      text-transform: uppercase;
      margin-bottom: 30px;
    }

    .tradition {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-size: clamp(20px, 2.2vw, 31px);
      line-height: 1.35;
      max-width: 500px;
    }

.panel {
  background: rgba(10, 29, 21, 0.82);
  border: 1px solid rgba(255,255,255,0.20);
  border-radius: 16px;
  padding: 12px;
  box-shadow: 0 12px 30px rgba(0,0,0,0.28);
  backdrop-filter: blur(5px);
  text-align: center;
  max-width: 220px;
  width: 100%;
  justify-self: end;
  align-self: end;
  margin-bottom: 35px;
}

    .eyebrow {
      color: #e7d59c;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .panel h2 {
      font-size: 34px;
      margin: 0 0 16px;
    }

    .panel p {
      color: rgba(255,255,255,0.86);
      font-size: 18px;
      line-height: 1.5;
      margin: 0 0 28px;
    }

.button {
  display: inline-block;
  width: auto;
  padding: 8px 16px;
  background: #19b86a;
  color: white;
  text-decoration: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 700;
}

    .button:active {
      transform: translateY(1px);
    }

    .year {
      margin-top: 18px;
      font-size: 14px;
      color: rgba(255,255,255,0.62);
    }

    @media (max-width: 800px) {
      .screen {
        grid-template-columns: 1fr;
        padding: 34px 24px;
        gap: 28px;
      }

      .brand {
        text-align: center;
        margin: 0 auto;
      }

      .rule {
        margin-left: auto;
        margin-right: auto;
      }

      .panel {
        justify-self: center;
      }

      .green-jacket {
        letter-spacing: 6px;
      }

      .motto {
        letter-spacing: 4px;
      }
    }
  </style>
</head>

<body>

  <main class="screen">

    <section class="brand">
      <div class="jacket">🧥</div>

      <h1 class="summerland">SUMMERLAND MASTERS</h1>

      <div class="green-jacket">GREEN JACKET</div>

      <div class="rule"></div>

      <div class="motto">
        PICK • PLAY • FOLLOW • WIN
      </div>

      <div class="tradition">
  <a class="button" href="details.html">Details</a>
</div>
    </section>

  

  </main>

</body>
</html>
